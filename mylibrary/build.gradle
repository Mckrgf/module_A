plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.plugin.compose'
}

group='com.github.MCKRGF'

android {
    namespace 'com.yaobing.framemvpproject.mylibrary'

    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    lintOptions {
        abortOnError false
    }
    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }

    // 添加以下配置排除重复的 LICENSE.txt 文件
    packagingOptions {
        exclude 'META-INF/androidx/annotation/annotation/LICENSE.txt'
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'io.sentry:sentry-android:7.20.0'
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation files('libs/rclayout-1.0.0.aar')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.core:core-ktx:$rootProject.ext.ktxCoreVersion"
    implementation "androidx.appcompat:appcompat:$rootProject.ext.appcompatVersion"
    implementation "androidx.constraintlayout:constraintlayout:$rootProject.ext.constraintlayoutVersion"
    implementation 'com.google.android.material:material:1.4.+'
    implementation 'androidx.paging:paging-common-ktx:3.2.0'
    implementation files('libs\\inewise-qrcode-app-1.0.0.jar')
    implementation files('libs\\inewise-qrcode-core-1.0.0.jar')
    implementation files('libs\\inewise-qrcode-javase-1.0.0.jar')
    implementation files('libs\\inewise-qrcode-javase-1.0.0.jar')
    implementation files('libs\\commons-codec-1.15-android.jar')
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.paging:paging-compose:3.3.6'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    implementation project(':module_middleware')
    api project(path: ':module_common_view')
    implementation project(path: ':module_base:module_apt')
    kapt project(path: ':module_base:module_compiler')

    implementation 'com.github.bumptech.glide:glide:4.13.2'
    kapt 'com.github.bumptech.glide:compiler:4.13.2'
    implementation 'com.github.getActivity:EasyWindow:10.6'
    implementation 'com.tencent.mars:mars-xlog:1.2.6'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.13.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.50'
    //2.x
    implementation 'com.scwang.smart:refresh-layout-horizontal:2.0.0'
    implementation 'com.scwang.smart:refresh-layout-kernel:2.0.1'
    implementation 'com.scwang.smart:refresh-header-classics:2.0.1'
    implementation 'com.scwang.smart:refresh-header-material:2.0.1'
}
